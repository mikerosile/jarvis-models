version = 1

[*]
n-gpu-layers = -1
ctx-size = 8192
jinja = true
stop-timeout = 30
cache-type-k = q4_0
cache-type-v = q4_0
threads = 8
parallel = 1
batch-size = 2048
ubatch-size = 512
flash-attn = true

[gpt-oss-20b]
model = /models/gpt-oss-20b/model.gguf
load-on-startup = true
reasoning-preserve = true
reasoning-effort = medium
ctx-size = 65535

[llava-7b]
model = /models/llava-7b/model.gguf

[qwen3.8-27b]
model = /models/qwen3.8-27b/model.gguf
reasoning-preserve = true
ctx-size = 65535

[qwen2.5-coder-14b]
model = /models/qwen2.5-coder-14b/model.gguf
temperature = 0.7
